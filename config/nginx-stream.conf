# Nginx TCP 负载均衡配置
# 用于 MyMuduo Chat 集群

stream {
    # 定义后端服务器组
    upstream chatserver_backend {
        # 负载均衡策略：轮询（默认）
        # 其他策略：least_conn（最少连接）、ip_hash（IP 哈希）

        server 127.0.0.1:8888 weight=1 max_fails=3 fail_timeout=30s;
        server 127.0.0.1:8889 weight=1 max_fails=3 fail_timeout=30s;
        # 可以添加更多后端服务器
        # server 127.0.0.1:8890 weight=1 max_fails=3 fail_timeout=30s;
    }

    # TCP 负载均衡服务
    server {
        listen 9000;  # nginx 监听端口
        proxy_pass chatserver_backend;

        # TCP 连接超时设置
        proxy_connect_timeout 10s;
        proxy_timeout 300s;  # 5 分钟空闲超时

        # 启用 TCP 长连接
        proxy_socket_keepalive on;
    }
}
